name: Update Qt version

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      qt_version:
        description: "Optional Qt or qt6-base package version, for example 6.11.1 or 6.11.1-1"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out package
        uses: actions/checkout@v4

      - name: Run updater in Arch Linux
        env:
          QT_VERSION: ${{ github.event.inputs.qt_version || '' }}
        run: |
          set -euo pipefail

          docker run --rm \
            --env QT_VERSION \
            --volume "$PWD:/repo" \
            --workdir /repo \
            archlinux:latest \
            bash -lc '
              set -euo pipefail

              pacman -Syu --noconfirm --needed git
              useradd -m builder
              chown -R builder:builder /repo

              runuser -u builder -- env QT_VERSION="${QT_VERSION:-}" bash -lc '"'"'
                set -euo pipefail
                cd /repo

                if [[ -n "${QT_VERSION:-}" ]]; then
                  ./update-qt-version "$QT_VERSION"
                else
                  ./update-qt-version
                fi
              '"'"'
            '

          sudo chown -R "$(id -u):$(id -g)" "$PWD"

      - name: Check for package changes
        id: package
        run: |
          set -euo pipefail

          if git diff --quiet -- PKGBUILD .SRCINFO; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(awk -F= '/^_pkgver=/ { print $2; exit }' PKGBUILD)
          if [[ -z "$version" ]]; then
            echo "Could not read _pkgver from PKGBUILD" >&2
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure SSH for AUR
        if: steps.package.outputs.changed == 'true' && secrets.AUR_SSH_PRIVATE_KEY != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Trust AUR host
        if: steps.package.outputs.changed == 'true' && secrets.AUR_SSH_PRIVATE_KEY != ''
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Publish and open pull request
        if: steps.package.outputs.changed == 'true'
        env:
          BRANCH: automation/update-qt-version
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          PUSH_AUR: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail

          export AUR_REMOTE='ssh://aur@aur.archlinux.org/qt6-interfaceframework.git'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add PKGBUILD .SRCINFO
          git commit -m "Update qt6-interfaceframework to $VERSION"

          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git push --force-with-lease origin HEAD:"$BRANCH"

          if [[ "$PUSH_AUR" == "true" ]]; then
            if git remote get-url aur >/dev/null 2>&1; then
              git remote set-url aur "$AUR_REMOTE"
            else
              git remote add aur "$AUR_REMOTE"
            fi

            git push --force aur "$BRANCH:master"
            echo "Pushed update to AUR."
          else
            echo "Skipping AUR push: AUR_SSH_PRIVATE_KEY not configured."
          fi

          body=$(mktemp)
          {
            echo "Automated update generated by \`./update-qt-version\`."
            echo
            echo "- Qt version: \`$VERSION\`"
            echo "- Source tag: \`v$VERSION\`"
          } > "$body"

          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Update qt6-interfaceframework to $VERSION" \
              --body-file "$body"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$GITHUB_REF_NAME" \
              --head "$BRANCH" \
              --title "Update qt6-interfaceframework to $VERSION" \
              --body-file "$body"
          fi
